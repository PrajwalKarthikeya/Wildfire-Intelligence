<!DOCTYPE html>
<html>
<head>
    <title>Wildfire Intelligence - Phase 6 Prototype Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background-color: #1a1a1a; color: white; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        .info-box {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            max-width: 300px;
        }
        h2 { margin-top: 0; color: #e74c3c; }
        .legend { margin-top: 10px; }
        .legend-item { display: flex; align-items: center; margin-bottom: 5px; }
        .color-box { width: 15px; height: 15px; margin-right: 10px; border-radius: 3px; }
    </style>
</head>
<body>

<div id="map"></div>

<div class="info-box">
    <h2>🛰️ Wildfire Intelligence</h2>
    <p>Predictive Risk Model (California)</p>
    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background:#8e44ad"></div>EXTREME (80-100%)</div>
        <div class="legend-item"><div class="color-box" style="background:#e74c3c"></div>HIGH (60-80%)</div>
        <div class="legend-item"><div class="color-box" style="background:#e67e22"></div>ELEVATED (40-60%)</div>
        <div class="legend-item"><div class="color-box" style="background:#f1c40f"></div>MODERATE (20-40%)</div>
        <div class="legend-item"><div class="color-box" style="background:#2ecc71"></div>LOW (0-20%)</div>
    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // Initialize map centered on California
    var map = L.map('map').setView([36.7783, -119.4179], 6);

    // Dark carto map tiles for the "Intelligence" aesthetic
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
    }).addTo(map);

    // Fetch and render the GeoJSON
    // Note: Since this is a local file, you must run a local server (e.g., python -m http.server) to avoid CORS issues
    fetch('../data/risk_grid.geojson')
        .then(response => response.json())
        .then(data => {
            L.geoJSON(data, {
                style: function(feature) {
                    // Make lower risks more transparent to focus on danger zones
                    let opacity = feature.properties.risk_category === "LOW" ? 0.1 :
                                  feature.properties.risk_category === "MODERATE" ? 0.3 : 0.6;
                    
                    return {
                        fillColor: feature.properties.color,
                        weight: 1,
                        opacity: 0.3,
                        color: 'white',
                        fillOpacity: opacity
                    };
                },
                onEachFeature: function(feature, layer) {
                    // Create Popup content
                    let props = feature.properties;
                    let popupContent = `
                        <div style="color: black; font-family: sans-serif;">
                            <h3 style="margin-top:0; color:${props.color}">Risk: ${props.risk_percent}% (${props.risk_category})</h3>
                            <b>Recent Fires:</b> ${props.fires_last_24h}<br/>
                            <b>Temperature:</b> ${props.temperature_c}°C<br/>
                            <b>Humidity:</b> ${props.humidity_percent}%<br/>
                            <b>Wind:</b> ${props.wind_speed_kmh} km/h<br/>
                        </div>
                    `;
                    layer.bindPopup(popupContent);
                }
            }).addTo(map);
        })
        .catch(err => console.error("Could not load GeoJSON. Are you running a local web server?", err));
</script>

</body>
</html>
